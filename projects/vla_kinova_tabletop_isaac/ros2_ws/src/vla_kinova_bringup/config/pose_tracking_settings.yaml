#################################
# PID parameters for pose tracking. Loaded under the 'moveit_servo' namespace
# alongside servo.yaml. Stock MoveIt defaults — retune once teleop is working.
#################################

windup_limit: 0.05

# For real robot let's start with lower values
x_proportional_gain: 10.0
y_proportional_gain: 10.0
z_proportional_gain: 10.0
x_integral_gain: 0.5
y_integral_gain: 0.5
z_integral_gain: 0.5
x_derivative_gain: 0.0
y_derivative_gain: 0.0
z_derivative_gain: 0.0

angular_proportional_gain: 10.0
angular_integral_gain: 0.5
angular_derivative_gain: 0.0

# More aggressive sim values
# x_proportional_gain: 40.0
# y_proportional_gain: 40.0
# z_proportional_gain: 40.0
# x_integral_gain: 1.0
# y_integral_gain: 1.0
# z_integral_gain: 1.0
# x_derivative_gain: 0.0
# y_derivative_gain: 0.0
# z_derivative_gain: 0.0

