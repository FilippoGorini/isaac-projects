#################################
# PID + saturation config for twist_pose_tracking_node.
#
# The node computes a 6D pose error in base_link, runs PID on each axis,
# saturates the resulting twist, then rotates it into the tool frame
# (end_effector_link) before publishing. The picknik_twist_controller then
# forwards it to kortex_driver, which interprets it in CARTESIAN_REFERENCE_FRAME_TOOL.

#################################

twist_pose_tracking_node:
  ros__parameters:
    loop_rate_hz: 100.0                 # Pose tracking rate (kinova's twist controller on the firmware runs at 40 Hz)

    # Stale-target handling — when fresh targets stop arriving:
    #   age <= grace                    : full PID (no scaling, no flutter during normal tracking)
    #   grace < age < grace+decel       : output twist is linearly faded toward zero
    #   age >= grace+decel              : hard zero twist, integrators reset
    # We don't want the ramp to engage during normal operation so the grace period must be greater than the time between ...
    # ... 2 consecutive target poses. In the case of quest2ros2 the poses are coming at a rate of 60/70 Hz so we need at least 1/60 = ~17 ms 
    target_grace_period_s: 0.035        # absorbs Quest2ROS2 inter-arrival jitter
    target_decel_window_s: 0.085        # time window over which the twist is scaled down to 0 linearly after grace period has elapsed

    base_frame: base_link
    ee_frame: end_effector_link         # frame that the kinova firmware expects twists to be expressed in
    control_frame: fingertips_frame           # frame the PID regulates against the target (we defined fingertips_frame in the urdf as the end effector frame shifted along its z axis so that the control point is between the finger tips)
    target_topic: /target_frame         # Topic for the target pose to track (expressed in base frame)
    twist_command_topic: /twist_controller/commands   # Topic on which the kinova twist controller listens for twist commands

    # Saturation applied to norm of linear and angular velocities, applied in base frame before rotation onto the end effector frame
    max_linear_velocity: 0.45           # [m/s]
    max_angular_velocity: 1.50          # [rad/s]

    # Anti windup cap to be applied to the integrator state, per axis
    linear_windup_limit: 0.04
    angular_windup_limit: 0.025

    # Linear PID gains, applied on error computed in base frame
    x_proportional_gain: 2.5
    y_proportional_gain: 2.5
    z_proportional_gain: 2.5
    x_integral_gain: 0.2
    y_integral_gain: 0.2
    z_integral_gain: 0.2
    x_derivative_gain: 0.07        
    y_derivative_gain: 0.07
    z_derivative_gain: 0.07

    # Angular PID gains, applied on error computed in base frame (shared between roll pitch yaw)
    angular_proportional_gain: 1.8
    angular_integral_gain: 0.1
    angular_derivative_gain: 0.04
