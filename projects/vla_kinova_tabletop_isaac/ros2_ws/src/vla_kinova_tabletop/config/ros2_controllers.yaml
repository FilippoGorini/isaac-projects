controller_manager:
  ros__parameters:
    update_rate: 1000  # Hz
    # This parameter controls the controller manager frequency and is the one actually ...
    # ... responsible of the joint_trajectory_controller rate, and is the one trying to use RT scheduling
    # When using the twist controller, the RPC call to the high level api is blocking therefore the actual rate is throttled down to 40 Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    twist_controller:
      type: picknik_twist_controller/PicknikTwistController

    robotiq_gripper_controller:
      type: position_controllers/GripperActionController
    # New gripper velocity controller for teleop
    gripper_velocity_controller:
      type: forward_command_controller/ForwardCommandController

    fault_controller:
      type: picknik_reset_fault_controller/PicknikResetFaultController

joint_trajectory_controller:
  ros__parameters:
    joints:
      - joint_1
      - joint_2
      - joint_3
      - joint_4
      - joint_5
      - joint_6
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    state_publish_rate: 100.0   # Rate for the controller_state topic, it can run at a lower rate
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    open_loop_control: false    # Switched back to false now that we skipped moveit servo
    # On (re)activation, re-sync JTC's internal commanded state from the measured
    # state rather than the stale last command interface value.
    set_last_command_interface_value_as_state_on_activation: false  # Not needed anymore now that moveit servo is bypassed but doesn't hurt 
    constraints:
      stopped_velocity_tolerance: 0.0
      goal_time: 0.5

twist_controller:
  ros__parameters:
    joint: tcp
    interface_names:
      - twist.linear.x
      - twist.linear.y
      - twist.linear.z
      - twist.angular.x
      - twist.angular.y
      - twist.angular.z

robotiq_gripper_controller:
  ros__parameters:
    default: true
    joint: robotiq_85_left_knuckle_joint
    allow_stalling: true

gripper_velocity_controller:
  ros__parameters:
    joints:
      - robotiq_85_left_knuckle_joint
    interface_name: velocity
    # Commands arrive on /gripper_velocity_controller/commands as a
    # std_msgs/Float64MultiArray of length 1 with a signed speed in [-1, 1].
