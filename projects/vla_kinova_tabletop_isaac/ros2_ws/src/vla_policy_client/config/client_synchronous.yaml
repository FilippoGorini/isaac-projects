policy_client_synchronous:
  ros__parameters:
    policy_host: "localhost"
    policy_port: 8000
    prompt: "lift the blue cube"
    control_hz: 30.0          # rate at which each action chunk's step is executed
    use_sim: true             # false => real-robot camera topics + use_sim_time off

    # Gripper hysteresis (model output is near-binary 0 open / ~0.8 closed)
    gripper_close_threshold: 0.55
    gripper_open_threshold: 0.30
    gripper_closed_position: 0.8
    gripper_open_position: 0.0
    gripper_max_effort: 50.0

    # Camera topics. Both pairs are listed; use_sim picks which one is used.
    # Sim = Isaac Sim publishers, real = RealSense D435 (external) + Kinova wrist.
    sim_base_image_topic:  "/isaac_external_camera/color/image_raw"
    sim_wrist_image_topic: "/isaac_wrist_camera/color/image_raw"
    real_base_image_topic:  "/realsense/d435/color/image_raw"
    real_wrist_image_topic: "/camera/color/image_raw"

    # Not split sim/real: /joint_states (joint_state_broadcaster output, what the
    # dataset was recorded from; read by joint name so its scrambled order is fine)
    # and the controllers, which are spawned identically in both modes.
    joint_states_topic: "/joint_states"
    arm_action: "/joint_trajectory_controller/follow_joint_trajectory"
    gripper_action: "/robotiq_gripper_controller/gripper_cmd"
