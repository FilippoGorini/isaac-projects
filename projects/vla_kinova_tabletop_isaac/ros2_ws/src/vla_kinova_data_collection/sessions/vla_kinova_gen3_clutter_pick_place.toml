# =============================================================================
# RECORDING SESSION — VLA pick-and-place (Kinova Gen3 + Robotiq 2F-85)
# =============================================================================
#
# Task template: "<pick> <object reference> and <place> it <destination reference>"
#
# TAG FORMAT (per task group):
#   # O# | D# | density: sparse|medium|dense | access: open|blocking     <N>
#   <N> = total objects (targets + destinations) summed over ALL episodes in the
#   group; divide by `episodes` for avg objects/episode.
#   O# object-reference type:  O1 direct/named | O2 visual-property | O3 spatial |
#                              O4 functional.
#   D# destination-reference type:  D1 named container/surface | D2 shape
#      (round vs rectangular) | D3 spatial (left/right/closer) | D4 relational
#      (onto/under/over another object).
#
# DENSITY BANDS (avg objects/episode, targets + destinations) — re-derived from
#   the actual recorded scenes (the original 3-4 / 6-8 / 9-12 scale was far too
#   low; real scenes averaged ~11 objects):
#     sparse <= 6 | medium 7-11 | dense >= 12
#
# ACCESS (binary):
#   open     = target directly graspable.
#   blocking = any physically-intelligent clearing was required — moving an
#              in-the-way object, nudging/pushing it aside, flipping an upside-down
#              destination cup, or uncovering an occluded target.
#
# RULES: verbs rotated (pick/pick up/grab/take/get + put/place/set), verb matches
#   action; no "push/move/clear/tidy" in prompts (clearing is emergent)
# =============================================================================

